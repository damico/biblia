spring.application.name=biblia
server.port=8089
# Served under https://josedamico.com.br/biblia (nginx proxies the path unchanged).
server.servlet.context-path=/biblia
# Compress JSON/HTML here, before the VPN tunnel: the uplink of the lab is the narrow link.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# PostgreSQL on the same VM. The password is not set here: the JDBC driver
# reads it from ~/.pgpass (or set SPRING_DATASOURCE_PASSWORD in the environment).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblia}
spring.datasource.username=${DB_USER:biblia}
